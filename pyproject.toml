[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cm-xbeam"
version = "0.1.0"
description = "Covariance-aligned xLSTM memory for constrained multichannel neural beamforming"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "scipy>=1.10", "soundfile>=0.12", "h5py>=3.8", "PyYAML>=6", "xlstm==2.0.5", "einops>=0.7", "tqdm>=4.66"]

[project.optional-dependencies]
metrics = ["pystoi>=0.4", "pesq>=0.0.4"]
simulation = ["pyroomacoustics>=0.8"]
plots = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["cm_xbeam*"]
