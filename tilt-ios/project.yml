name: TILT

options:
  bundleIdPrefix: app.tiltphoto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  TILT:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tiltphoto.ios
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "TILT"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSCameraUsageDescription: "TILT needs the camera to capture moments that move when you tilt your phone."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "TILT can save your favorite frame or exported loop to Photos."

  TILTTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: TILT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tiltphoto.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  TILT:
    build:
      targets:
        TILT: all
        TILTTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TILTTests
    archive:
      config: Release
