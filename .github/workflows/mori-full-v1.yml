name: Build MORI 1.0 Full Offline IPA

on:
  push:
    branches: [mori-full-v1]

concurrency:
  group: mori-full-v1
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          architecture: ARM64

      - name: Reconstruct and verify MORI 1.0 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mori-src /tmp/MORI-1.0.0-source.tar.gz
          mkdir -p /tmp/mori-src
          cat mori-v1-pack/part* | base64 -D > /tmp/MORI-1.0.0-source.tar.gz
          echo "613c36edaa26f339f18de987122e9559c6b6cc1cbcf91891fe85704d4b4873fa  /tmp/MORI-1.0.0-source.tar.gz" | shasum -a 256 -c -
          tar -tzf /tmp/MORI-1.0.0-source.tar.gz >/dev/null
          tar -xzf /tmp/MORI-1.0.0-source.tar.gz -C /tmp/mori-src
          test -f /tmp/mori-src/MORI/pubspec.yaml
          test -f /tmp/mori-src/MORI/lib/core/services/backup_service.dart
          test -f /tmp/mori-src/MORI/lib/features/universe/universe_screen.dart
          test -f /tmp/mori-src/MORI/lib/features/memories/recap_view.dart

      - name: Apply verified dependency compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/mori-src/MORI/pubspec.yaml')
          s = p.read_text().replace('geolocator: ^14.1.1', 'geolocator: ^14.0.2')
          if 'geolocator: ^14.0.2' not in s:
              raise SystemExit('Expected geolocator constraint missing')
          p.write_text(s)
          PY

      - name: Create clean Flutter iOS project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mori-build
          flutter create --platforms=ios --org app.viethannn --project-name mori mori-build
          rm -rf mori-build/lib mori-build/test mori-build/tools
          cp -R /tmp/mori-src/MORI/lib mori-build/lib
          cp -R /tmp/mori-src/MORI/test mori-build/test
          cp -R /tmp/mori-src/MORI/tools mori-build/tools
          cp /tmp/mori-src/MORI/pubspec.yaml mori-build/pubspec.yaml
          cp /tmp/mori-src/MORI/analysis_options.yaml mori-build/analysis_options.yaml
          cp /tmp/mori-src/MORI/README.md mori-build/README.md
          INFO="mori-build/ios/Runner/Info.plist"
          set_plist() {
            local key="$1" value="$2"
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$INFO" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :$key string $value" "$INFO"
          }
          set_plist CFBundleDisplayName MORI
          set_plist NSPhotoLibraryUsageDescription "MORI uses your photo library only when you choose a photo for a memory."
          set_plist NSCameraUsageDescription "MORI uses the camera only when you choose to capture a memory."
          set_plist NSMicrophoneUsageDescription "MORI uses the microphone only when you record a short sound for a memory."
          set_plist NSLocationWhenInUseUsageDescription "MORI can optionally save coordinates with a memory. Location stays on this iPhone."
          cd mori-build
          flutter pub get

      - name: Strict-safe Dart cleanup
        working-directory: mori-build
        shell: bash
        run: |
          set -euo pipefail
          dart fix --apply
          dart format lib test
          python3 - <<'PY'
          from pathlib import Path

          PAIRS = {'(': ')', '{': '}', '[': ']'}
          CLOSERS = set(PAIRS.values())

          def indent_of(line):
              return line[:len(line) - len(line.lstrip())]

          def scan_balanced_statement(lines, start):
              stack = []
              quote = None
              escape = False
              began = False
              for k in range(start, min(len(lines), start + 80)):
                  text = lines[k]
                  for ch in text:
                      if quote:
                          if escape:
                              escape = False
                          elif ch == '\\':
                              escape = True
                          elif ch == quote:
                              quote = None
                          continue
                      if ch in ('\"', "'"):
                          quote = ch
                          began = True
                          continue
                      if ch in PAIRS:
                          stack.append(PAIRS[ch])
                          began = True
                      elif ch in CLOSERS:
                          if stack and ch == stack[-1]:
                              stack.pop()
                          began = True
                      elif not ch.isspace():
                          began = True
                  if began and not stack and text.strip().endswith(';'):
                      return k
              return None

          def find_if_condition_end(lines, start):
              depth = 0
              began = False
              quote = None
              escape = False
              for k in range(start, min(len(lines), start + 30)):
                  text = lines[k]
                  col0 = text.find('(') if k == start else 0
                  if k == start and col0 < 0:
                      return None
                  for col in range(col0, len(text)):
                      ch = text[col]
                      if quote:
                          if escape:
                              escape = False
                          elif ch == '\\':
                              escape = True
                          elif ch == quote:
                              quote = None
                          continue
                      if ch in ('\"', "'"):
                          quote = ch
                          continue
                      if ch == '(':
                          depth += 1
                          began = True
                      elif ch == ')' and began:
                          depth -= 1
                          if depth == 0:
                              return k, col
              return None

          def fix_file(path: Path):
              lines = path.read_text().splitlines()
              out = []
              i = 0
              changed = False
              while i < len(lines):
                  line = lines[i]
                  stripped = line.strip()
                  base_indent = indent_of(line)
                  if not stripped.startswith('if (') or '{' in stripped:
                      out.append(line)
                      i += 1
                      continue

                  end = find_if_condition_end(lines, i)
                  if end is None:
                      out.append(line)
                      i += 1
                      continue
                  end_line, end_col = end
                  tail = lines[end_line][end_col + 1:].strip()

                  # Already a braced body.
                  if tail.startswith('{'):
                      out.append(line)
                      i += 1
                      continue

                  # Body begins on the same physical line.
                  if tail:
                      # Only rewrite simple single statements. Collection-if
                      # elements usually end with comma and are intentionally skipped.
                      if tail.endswith(';'):
                          for k in range(i, end_line):
                              out.append(lines[k])
                          out.append(lines[end_line][:end_col + 1] + ' {')
                          out.append(base_indent + '  ' + tail)
                          out.append(base_indent + '}')
                          changed = True
                          i = end_line + 1
                          continue
                      out.append(line)
                      i += 1
                      continue

                  body_start = end_line + 1
                  if body_start >= len(lines):
                      out.append(line)
                      i += 1
                      continue
                  first = lines[body_start].strip()
                  if not first or first.startswith(('{', 'else')):
                      out.append(line)
                      i += 1
                      continue

                  statement_end = scan_balanced_statement(lines, body_start)
                  if statement_end is None:
                      out.append(line)
                      i += 1
                      continue

                  # Preserve every condition line exactly, adding the opening brace
                  # only after the final condition line. Preserve the full body,
                  # including nested callbacks, until its balanced terminating `;`.
                  for k in range(i, end_line):
                      out.append(lines[k])
                  out.append(lines[end_line] + ' {')
                  for k in range(body_start, statement_end + 1):
                      out.append(lines[k])
                  out.append(base_indent + '}')
                  changed = True
                  i = statement_end + 1

              if changed:
                  path.write_text('\n'.join(out) + '\n')

          # Only fix the file known to contain the remaining strict lint. Other
          # files are handled by `dart fix`, reducing rewrite risk.
          fix_file(Path('lib/features/capture/capture_screen.dart'))
          PY
          dart format lib test
          dart fix --apply
          dart format lib test

      - name: Generate MORI app icon
        shell: bash
        run: |
          set -euo pipefail
          cd mori-build
          swift tools/generate_icon.swift /tmp/mori_icon_1024.png
          file /tmp/mori_icon_1024.png | grep -q 'PNG image data, 1024 x 1024'
          python3 - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path('ios/Runner/Assets.xcassets/AppIcon.appiconset')
          data = json.loads((root/'Contents.json').read_text())
          written = 0
          for item in data.get('images', []):
              fn, size, scale = item.get('filename'), item.get('size'), item.get('scale')
              if not fn or not size or not scale:
                  continue
              pixels = int(round(float(size.split('x')[0]) * int(scale.rstrip('x'))))
              subprocess.run(['sips','-z',str(pixels),str(pixels),'/tmp/mori_icon_1024.png','--out',str(root/fn)], check=True, stdout=subprocess.DEVNULL)
              written += 1
          if written == 0:
              raise SystemExit('No app icon slots were written')
          PY

      - name: Flutter analyze
        working-directory: mori-build
        run: flutter analyze --fatal-infos

      - name: Unit tests
        working-directory: mori-build
        run: flutter test

      - name: Build iPhone Release
        working-directory: mori-build
        run: flutter build ios --release --no-codesign

      - name: Verify built app and offline contract
        shell: bash
        run: |
          set -euo pipefail
          APP="mori-build/build/ios/iphoneos/Runner.app"
          test -d "$APP"
          test -f "$APP/Runner"
          test -f "$APP/Assets.car"
          test -d "$APP/Frameworks/App.framework/flutter_assets"
          file "$APP/Runner" | grep -qi arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "app.viethannn.mori"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "1.0.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "10"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")" = "MORI"
          ! grep -R -I -E 'firebase|supabase|analytics|http[s]?://' mori-build/lib mori-build/pubspec.yaml
          grep -R -I -q 'VietHannn' mori-build/lib

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mori-ipa
          mkdir -p /tmp/mori-ipa/Payload
          cp -R mori-build/build/ios/iphoneos/Runner.app /tmp/mori-ipa/Payload/Runner.app
          cd /tmp/mori-ipa
          zip -qry "$GITHUB_WORKSPACE/MORI-1.0.0-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/MORI-1.0.0-unsigned.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/MORI-1.0.0-unsigned.ipa"

      - name: Prepare formatted source artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mori-src/MORI/lib /tmp/mori-src/MORI/test
          cp -R mori-build/lib /tmp/mori-src/MORI/lib
          cp -R mori-build/test /tmp/mori-src/MORI/test
          cp mori-build/pubspec.yaml /tmp/mori-src/MORI/pubspec.yaml
          tar -czf MORI-1.0.0-source.tar.gz -C /tmp/mori-src MORI
          shasum -a 256 MORI-1.0.0-source.tar.gz

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MORI-1.0.0-IPA
          path: MORI-1.0.0-unsigned.ipa
          if-no-files-found: error

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: MORI-1.0.0-source
          path: MORI-1.0.0-source.tar.gz
          if-no-files-found: error
