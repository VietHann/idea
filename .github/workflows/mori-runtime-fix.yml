name: Build MORI 1.0.1 Runtime Fix

on:
  push:
    branches: [mori-full-v1]

concurrency:
  group: mori-runtime-fix
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          architecture: ARM64

      - name: Reconstruct source and apply runtime fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mori-src /tmp/MORI-source.tar.gz mori-build
          mkdir -p /tmp/mori-src
          cat mori-v1-pack/part* | base64 -D > /tmp/MORI-source.tar.gz
          echo "613c36edaa26f339f18de987122e9559c6b6cc1cbcf91891fe85704d4b4873fa  /tmp/MORI-source.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/MORI-source.tar.gz -C /tmp/mori-src

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/mori-src/MORI/pubspec.yaml')
          s = p.read_text()
          s = s.replace('version: 1.0.0+10', 'version: 1.0.1+11')
          s = s.replace('geolocator: ^14.1.1', 'geolocator: ^14.0.2')
          p.write_text(s)
          PY

          flutter create --platforms=ios --org app.viethannn --project-name mori mori-build
          rm -rf mori-build/lib mori-build/test mori-build/tools
          cp -R /tmp/mori-src/MORI/lib mori-build/lib
          cp -R /tmp/mori-src/MORI/test mori-build/test
          cp -R /tmp/mori-src/MORI/tools mori-build/tools
          cp /tmp/mori-src/MORI/pubspec.yaml mori-build/pubspec.yaml
          cp /tmp/mori-src/MORI/analysis_options.yaml mori-build/analysis_options.yaml
          cp /tmp/mori-src/MORI/README.md mori-build/README.md

          cp mori-runtime-fix/main.dart mori-build/lib/main.dart
          cp mori-runtime-fix/local_database.dart mori-build/lib/core/storage/local_database.dart

          INFO="mori-build/ios/Runner/Info.plist"
          set_plist() {
            local key="$1" value="$2"
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$INFO" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :$key string $value" "$INFO"
          }
          set_plist CFBundleDisplayName MORI
          set_plist NSPhotoLibraryUsageDescription "MORI uses your photo library only when you choose a photo for a memory."
          set_plist NSCameraUsageDescription "MORI uses the camera only when you choose to capture a memory."
          set_plist NSMicrophoneUsageDescription "MORI uses the microphone only when you record a short sound for a memory."
          set_plist NSLocationWhenInUseUsageDescription "MORI can optionally save coordinates with a memory. Location stays on this iPhone."

          cd mori-build
          flutter pub get

      - name: Apply known strict lint fixes
        working-directory: mori-build
        shell: bash
        run: |
          set -euo pipefail
          dart fix --apply
          dart format lib test
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub1(path, pattern, replacement):
              p = Path(path)
              source = p.read_text()
              updated, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Expected exactly one targeted replacement in {path}, got {count}')
              p.write_text(updated)

          sub1(
              'lib/core/services/backup_service.dart',
              r"      if \(isDaily && await memories\.dailyMemory\(capturedAt\) != null\)\n        isDaily = false;",
              "      if (isDaily && await memories.dailyMemory(capturedAt) != null) {\n        isDaily = false;\n      }",
          )
          sub1(
              'lib/features/capture/capture_screen.dart',
              r"    if \(permission == LocationPermission\.denied\)\n      permission = await Geolocator\.requestPermission\(\);",
              "    if (permission == LocationPermission.denied) {\n      permission = await Geolocator.requestPermission();\n    }",
          )
          sub1(
              'lib/features/capture/capture_screen.dart',
              r"    if \(permission == LocationPermission\.denied \|\|\n        permission == LocationPermission\.deniedForever\)\n      return;",
              "    if (permission == LocationPermission.denied ||\n        permission == LocationPermission.deniedForever) {\n      return;\n    }",
          )
          sub1(
              'lib/features/capture/capture_screen.dart',
              r"                if \(mounted\)\n                  setState\(\(\) \{\n                    _audioPath = null;\n                    _audioSeconds = 0;\n                  \}\);",
              "                if (mounted) {\n                  setState(() {\n                    _audioPath = null;\n                    _audioSeconds = 0;\n                  });\n                }",
          )
          sub1(
              'lib/features/memories/recap_view.dart',
              r"      if \(_period == 0\) _anchor = _anchor\.add\(Duration\(days: 7 \* direction\)\);\n      if \(_period == 1\)\n        _anchor = DateTime\(_anchor\.year, _anchor\.month \+ direction, 1\);\n      if \(_period == 2\) _anchor = DateTime\(_anchor\.year \+ direction, 1, 1\);",
              "      if (_period == 0) {\n        _anchor = _anchor.add(Duration(days: 7 * direction));\n      }\n      if (_period == 1) {\n        _anchor = DateTime(_anchor.year, _anchor.month + direction, 1);\n      }\n      if (_period == 2) {\n        _anchor = DateTime(_anchor.year + direction, 1, 1);\n      }",
          )
          PY
          dart format lib test

      - name: Generate app icon
        shell: bash
        run: |
          set -euo pipefail
          cd mori-build
          swift tools/generate_icon.swift /tmp/mori_icon_1024.png
          file /tmp/mori_icon_1024.png | grep -q 'PNG image data, 1024 x 1024'
          python3 - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path('ios/Runner/Assets.xcassets/AppIcon.appiconset')
          data = json.loads((root/'Contents.json').read_text())
          written = 0
          for item in data.get('images', []):
              fn, size, scale = item.get('filename'), item.get('size'), item.get('scale')
              if not fn or not size or not scale:
                  continue
              px = int(round(float(size.split('x')[0]) * int(scale.rstrip('x'))))
              subprocess.run(['sips','-z',str(px),str(px),'/tmp/mori_icon_1024.png','--out',str(root/fn)], check=True, stdout=subprocess.DEVNULL)
              written += 1
          if written == 0:
              raise SystemExit('No app icon slots were written')
          PY

      - name: Analyze
        working-directory: mori-build
        run: flutter analyze --fatal-infos

      - name: Unit tests
        working-directory: mori-build
        run: flutter test

      - name: Build simulator app
        working-directory: mori-build
        run: flutter build ios --simulator --debug

      - name: Runtime smoke test on iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for devices in d.values() for x in devices if x.get('isAvailable') and x.get('name','').startswith('iPhone')))" )
          echo "Using simulator: $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" mori-build/build/ios/iphonesimulator/Runner.app
          OUT=$(xcrun simctl launch "$UDID" app.viethannn.mori)
          echo "$OUT"
          PID=$(echo "$OUT" | awk -F': ' '{print $2}')
          test -n "$PID"
          sleep 8
          ps -p "$PID" >/dev/null
          xcrun simctl io "$UDID" screenshot /tmp/mori-runtime-startup.png
          file /tmp/mori-runtime-startup.png | grep -q 'PNG image data'

      - name: Upload runtime screenshot
        uses: actions/upload-artifact@v4
        with:
          name: MORI-1.0.1-runtime-screenshot
          path: /tmp/mori-runtime-startup.png
          if-no-files-found: error

      - name: Build iPhone Release
        working-directory: mori-build
        run: flutter build ios --release --no-codesign

      - name: Verify release app
        shell: bash
        run: |
          set -euo pipefail
          APP="mori-build/build/ios/iphoneos/Runner.app"
          test -d "$APP"
          test -f "$APP/Runner"
          test -f "$APP/Assets.car"
          test -d "$APP/Frameworks/App.framework/flutter_assets"
          file "$APP/Runner" | grep -qi arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "app.viethannn.mori"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "1.0.1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "11"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")" = "MORI"
          ! grep -R -I -E 'firebase|supabase|analytics|http[s]?://' mori-build/lib mori-build/pubspec.yaml
          grep -R -I -q 'VietHannn' mori-build/lib

      - name: Package unsigned IPA and source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mori-ipa
          mkdir -p /tmp/mori-ipa/Payload
          cp -R mori-build/build/ios/iphoneos/Runner.app /tmp/mori-ipa/Payload/Runner.app
          cd /tmp/mori-ipa
          zip -qry "$GITHUB_WORKSPACE/MORI-1.0.1-runtime-fix-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          tar -czf MORI-1.0.1-runtime-fix-source.tar.gz -C mori-build lib test tools pubspec.yaml analysis_options.yaml README.md
          shasum -a 256 MORI-1.0.1-runtime-fix-unsigned.ipa MORI-1.0.1-runtime-fix-source.tar.gz

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MORI-1.0.1-runtime-fix-IPA
          path: MORI-1.0.1-runtime-fix-unsigned.ipa
          if-no-files-found: error

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: MORI-1.0.1-runtime-fix-source
          path: MORI-1.0.1-runtime-fix-source.tar.gz
          if-no-files-found: error
