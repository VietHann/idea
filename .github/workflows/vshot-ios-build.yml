name: Build VShot IPA

on:
  push:
    branches: [vshot-ios-build]
    paths:
      - 'vshot-ios/**'
      - '.github/workflows/vshot-ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vshot-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate VShot icon
        working-directory: vshot-ios
        run: |
          swift - <<'SWIFT'
          import AppKit
          let size = NSSize(width: 1024, height: 1024)
          let image = NSImage(size: size)
          image.lockFocus()
          NSColor(calibratedRed: 1.0, green: 0.96, blue: 0.97, alpha: 1).setFill()
          NSBezierPath(rect: NSRect(origin: .zero, size: size)).fill()
          NSColor(calibratedRed: 1.0, green: 0.74, blue: 0.84, alpha: 1).setFill()
          NSBezierPath(ovalIn: NSRect(x: -120, y: 390, width: 720, height: 720)).fill()
          NSColor(calibratedRed: 0.78, green: 0.72, blue: 1.0, alpha: 1).setFill()
          NSBezierPath(ovalIn: NSRect(x: 430, y: -70, width: 700, height: 700)).fill()
          NSColor(calibratedRed: 0.10, green: 0.09, blue: 0.14, alpha: 1).setFill()
          NSBezierPath(roundedRect: NSRect(x: 170, y: 160, width: 690, height: 690), xRadius: 180, yRadius: 180).fill()
          NSColor.white.setFill()
          NSBezierPath(ovalIn: NSRect(x: 310, y: 300, width: 410, height: 410)).fill()
          NSColor(calibratedRed: 1.0, green: 0.72, blue: 0.82, alpha: 1).setFill()
          NSBezierPath(ovalIn: NSRect(x: 365, y: 355, width: 300, height: 300)).fill()
          NSColor(calibratedRed: 0.10, green: 0.09, blue: 0.14, alpha: 1).setFill()
          NSBezierPath(ovalIn: NSRect(x: 420, y: 410, width: 190, height: 190)).fill()
          image.unlockFocus()
          guard let tiff = image.tiffRepresentation, let rep = NSBitmapImageRep(data: tiff), let png = rep.representation(using: .png, properties: [:]) else { exit(1) }
          let url = URL(fileURLWithPath: "Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png")
          try png.write(to: url)
          SWIFT
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: vshot-ios
        run: xcodegen generate
      - name: Build VShot for iPhone
        working-directory: vshot-ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project VShot.xcodeproj \
            -scheme VShot \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package IPA
        working-directory: vshot-ios
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name 'VShot.app' | head -1)
          test -n "$APP_PATH"
          rm -rf Payload dist
          mkdir -p Payload dist
          cp -R "$APP_PATH" Payload/
          VER=$(tr -d ' \t\n\r' < VERSION)
          zip -qq -r "dist/VShot-${VER}-unsigned.ipa" Payload
          file "$APP_PATH/VShot" || true
          ls -lh dist/*.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: VShot-0.1.0-IPA
          path: vshot-ios/dist/*.ipa
          retention-days: 30
