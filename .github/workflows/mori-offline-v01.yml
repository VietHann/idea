name: Build MORI 0.1 Offline IPA

on:
  push:
    branches: [mori-offline-v01]

concurrency:
  group: mori-offline-v01
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          architecture: ARM64

      - name: Reconstruct and verify MORI source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mori-src /tmp/MORI-0.1.0-source.tar.gz
          mkdir -p /tmp/mori-src
          cat mori-v01-final-pack/part* | base64 -D > /tmp/MORI-0.1.0-source.tar.gz
          echo "7edaf2f565893d920f041aa59a8d8b32102daa998b08609acddc64fc1d4a6b76  /tmp/MORI-0.1.0-source.tar.gz" | shasum -a 256 -c -
          tar -tzf /tmp/MORI-0.1.0-source.tar.gz >/dev/null
          tar -xzf /tmp/MORI-0.1.0-source.tar.gz -C /tmp/mori-src
          test -f /tmp/mori-src/MORI/pubspec.yaml
          test -f /tmp/mori-src/MORI/lib/main.dart
          test -f /tmp/mori-src/MORI/lib/core/storage/local_database.dart
          test -f /tmp/mori-src/MORI/test/memory_test.dart

      - name: Create clean Flutter iOS project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mori-build
          flutter create --platforms=ios --org app.viethannn --project-name mori mori-build
          rm -rf mori-build/lib mori-build/test mori-build/tools
          cp -R /tmp/mori-src/MORI/lib mori-build/lib
          cp -R /tmp/mori-src/MORI/test mori-build/test
          cp -R /tmp/mori-src/MORI/tools mori-build/tools
          cp /tmp/mori-src/MORI/pubspec.yaml mori-build/pubspec.yaml
          cp /tmp/mori-src/MORI/analysis_options.yaml mori-build/analysis_options.yaml
          cp /tmp/mori-src/MORI/README.md mori-build/README.md

          INFO="mori-build/ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName MORI" "$INFO" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string MORI" "$INFO"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string MORI uses your photo library only to create memories stored on this iPhone." "$INFO"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string MORI uses the camera only when you choose to capture a memory." "$INFO"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string MORI uses the microphone only to record up to 10 seconds of sound for a memory." "$INFO"
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string MORI can optionally save coordinates with a memory. Location stays on this iPhone." "$INFO"

          cd mori-build
          flutter pub get

      - name: Configure iOS privacy build settings
        shell: bash
        run: |
          set -euo pipefail
          if [ -f mori-build/ios/Podfile ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('mori-build/ios/Podfile')
          s = p.read_text()
          needle = "      flutter_additional_ios_build_settings(target)"
          repl = """      flutter_additional_ios_build_settings(target)\n      target.build_configurations.each do |config|\n        config.build_settings['GCC_PREPROCESSOR_DEFINITIONS'] ||= ['$(inherited)']\n        config.build_settings['GCC_PREPROCESSOR_DEFINITIONS'] << 'BYPASS_PERMISSION_LOCATION_ALWAYS=1'\n      end"""
          if needle in s:
              p.write_text(s.replace(needle, repl, 1))
          PY
          else
            echo "No Podfile: modern Flutter iOS dependency layout detected; runtime permissions are scoped by Info.plist."
          fi

      - name: Patch and generate MORI app icon
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          paths = [Path('mori-build/tools/generate_icon.swift'), Path('/tmp/mori-src/MORI/tools/generate_icon.swift')]
          old1 = 'let t1 = AffineTransform(translationByX: 473, byY: 492).concatenated(with: AffineTransform(rotationByDegrees: 10)).concatenated(with: AffineTransform(translationByX: -473, byY: -492))\nback1.transform(using: t1)'
          new1 = 'var t1 = AffineTransform.identity\nt1.translate(x: 473, y: 492)\nt1.rotate(byDegrees: 10)\nt1.translate(x: -473, y: -492)\nback1.transform(using: t1)'
          old2 = 'let t2 = AffineTransform(translationByX: 551, byY: 492).concatenated(with: AffineTransform(rotationByDegrees: -10)).concatenated(with: AffineTransform(translationByX: -551, byY: -492))\nback2.transform(using: t2)'
          new2 = 'var t2 = AffineTransform.identity\nt2.translate(x: 551, y: 492)\nt2.rotate(byDegrees: -10)\nt2.translate(x: -551, y: -492)\nback2.transform(using: t2)'
          for p in paths:
              s = p.read_text()
              if old1 in s:
                  s = s.replace(old1, new1)
              if old2 in s:
                  s = s.replace(old2, new2)
              if '.concatenated(' in s:
                  raise SystemExit(f'Unpatched AffineTransform API remains in {p}')
              p.write_text(s)
          PY
          cd mori-build
          swift tools/generate_icon.swift /tmp/mori_icon_1024.png
          file /tmp/mori_icon_1024.png
          python3 - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path('ios/Runner/Assets.xcassets/AppIcon.appiconset')
          data = json.loads((root/'Contents.json').read_text())
          for item in data.get('images', []):
              fn = item.get('filename')
              size = item.get('size')
              scale = item.get('scale')
              if not fn or not size or not scale:
                  continue
              points = float(size.split('x')[0])
              factor = int(scale.rstrip('x'))
              pixels = int(round(points * factor))
              subprocess.run(['sips', '-z', str(pixels), str(pixels), '/tmp/mori_icon_1024.png', '--out', str(root/fn)], check=True, stdout=subprocess.DEVNULL)
          PY
          test -f ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png

      - name: Flutter analyze
        working-directory: mori-build
        run: flutter analyze --fatal-infos

      - name: Unit tests
        working-directory: mori-build
        run: flutter test

      - name: Build iPhone Release
        working-directory: mori-build
        run: flutter build ios --release --no-codesign

      - name: Verify built app
        shell: bash
        run: |
          set -euo pipefail
          APP="mori-build/build/ios/iphoneos/Runner.app"
          test -d "$APP"
          test -f "$APP/Runner"
          test -f "$APP/Assets.car"
          test -d "$APP/Frameworks/App.framework/flutter_assets"
          file "$APP/Runner" | grep -qi arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "app.viethannn.mori"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "0.1.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")" = "MORI"
          ! grep -R -I -E 'firebase|supabase|analytics|http[s]?://' mori-build/lib mori-build/pubspec.yaml

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mori-ipa
          mkdir -p /tmp/mori-ipa/Payload
          cp -R mori-build/build/ios/iphoneos/Runner.app /tmp/mori-ipa/Payload/Runner.app
          cd /tmp/mori-ipa
          zip -qry "$GITHUB_WORKSPACE/MORI-0.1.0-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/MORI-0.1.0-unsigned.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/MORI-0.1.0-unsigned.ipa"

      - name: Prepare source artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -czf MORI-0.1.0-source.tar.gz -C /tmp/mori-src MORI
          shasum -a 256 MORI-0.1.0-source.tar.gz

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MORI-0.1.0-IPA
          path: MORI-0.1.0-unsigned.ipa
          if-no-files-found: error

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: MORI-0.1.0-source
          path: MORI-0.1.0-source.tar.gz
          if-no-files-found: error
